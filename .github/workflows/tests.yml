name: Pruebas automatizadas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar el código con ESLint
        run: npm run lint
      - name: Ejecutar pruebas con Jest
        run: |
          set -o pipefail
          npm test | tee test-output.log
      - name: Publicar resumen de pruebas en Job Summary
        if: always() && hashFiles('test-output.log') != ''
        run: |
          {
            echo "## Resultados de las pruebas"
            echo ""
            echo '```text'
            sed -n '/^RESULTADOS DE LAS PRUEBAS$/,$p' test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
